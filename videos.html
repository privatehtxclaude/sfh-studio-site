<script>
document.getElementById('yr').textContent = new Date().getFullYear();
document.getElementById('mail').textContent = CONTACT.email;
// Cloudflare static assets ignore Range requests, so load each file as a blob when it nears the viewport to make scrubbing work.
const vio = new IntersectionObserver(es => es.forEach(async e => {
  if (!e.isIntersecting) return;
  const v = e.target; vio.unobserve(v);
  try {
    const blob = await (await fetch(v.getAttribute('src'))).blob();
    const t = v.currentTime, playing = !v.paused;
    v.preload = 'metadata';
    v.src = URL.createObjectURL(blob);
    if (t) v.currentTime = t;
    if (playing) v.play();
  } catch (_) {}
}), {rootMargin: '300px'});
document.querySelectorAll('#vgrid video').forEach(v => vio.observe(v));
</script>
